# Keeps this repo's copy of the bd plugin (bydefaultstudio/bd-plugin) on its latest release.
# Cloud sessions opened by another session (the Stand-up's) never get the installed plugin, so the repo
# carries a copy. Each day this checks bd-plugin's newest tag and, if it changed, opens a pull request.
# Merging stays Erlen's call. See Cloud sessions in agency's docs/machines.md.
name: bd plugin sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bd-plugin-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out bd-plugin (read-only token)
        uses: actions/checkout@v4
        with:
          repository: bydefaultstudio/bd-plugin
          token: ${{ secrets.BD_AGENTS_TOKEN }}
          path: _bd-plugin
          fetch-depth: 0

      - name: Use the latest release
        run: git -C _bd-plugin checkout -q "$(git -C _bd-plugin tag --sort=-v:refname | head -1)"

      - name: Copy the plugin into this repo
        run: bash .github/scripts/sync-bd-plugin.sh _bd-plugin .

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _bd-plugin
          if [ -z "$(git status --porcelain)" ]; then echo "Already up to date."; exit 0; fi
          version=$(sed -n 's/^version: //p' .claude/bd/README.md)
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B bd-plugin-sync
          git add -A
          git commit -q -m "Sync bd plugin $version"
          git push -f origin bd-plugin-sync
          if ! gh pr view bd-plugin-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr create --head bd-plugin-sync --base "${{ github.event.repository.default_branch }}" \
              --title "Sync bd plugin $version" \
              --body "Copies bd plugin $version (latest bd-plugin release) into this repo, so cloud sessions opened by the Stand-up have /bd: skills, bd-* agents and the plugin hooks. Generated by the bd plugin sync workflow. Merge when happy."
          fi
